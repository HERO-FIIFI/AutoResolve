[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentictriage-ai"
version = "0.1.0"
description = "Fail-safe, auditable support-ticket triage pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.9,<1",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
agentictriage = "agentictriage.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentictriage"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "evals"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agentictriage"]

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

[tool.vercel]
entrypoint = "src.agentictriage.api:app"
